[package]
name = "agenthub-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AgentHub Tauri v2 GUI shell (thin layer over agenthub-core)"
default-run = "agenthub-gui"

[lib]
name = "agenthub_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
go-route-bind-probe = []
go-route-product-probe = []
route-runtime-product-handoff-probe = ["go-route-product-probe"]
go-route-tcp-control-probe = []
plugin-write-probe = []

[[bin]]
name = "agenthub-gui"
path = "src/main.rs"

[[example]]
name = "go_route_bind_e2e_probe"
path = "examples/go_route_bind_e2e_probe.rs"
required-features = ["go-route-bind-probe"]

[[example]]
name = "go_route_product_e2e_probe"
path = "examples/go_route_product_e2e_probe.rs"
required-features = ["go-route-product-probe"]

[[example]]
name = "route_runtime_product_handoff_probe"
path = "examples/route_runtime_product_handoff_probe.rs"
required-features = ["route-runtime-product-handoff-probe"]

[[example]]
name = "plugin_write_e2e_probe"
path = "examples/plugin_write_e2e_probe.rs"
required-features = ["plugin-write-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dependencies]
agenthub-core = { workspace = true }
notify = { version = "6", features = ["macos_fsevent"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
urlencoding = { workspace = true }
libc = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }
