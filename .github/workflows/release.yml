name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Releases start from a v* tag whose commit is on origin/release.
# Build runs must never be cancelled midway after a later run of the same
# tag. Only the publish job receives a write token, and it runs after
# every platform build. CI never creates or moves tags.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Require a version tag
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "Releases may only run from a v* tag; received $GITHUB_REF" >&2
              exit 1
              ;;
          esac

      - name: Checkout tagged commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Require tagged commit is on origin/release
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in 1 2 3 4 5 6; do
            if git fetch --no-tags origin release; then
              if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
                found=1
                break
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/release; refusing to release." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: metadata
        run: node scripts/release-metadata.mjs --github-output "$GITHUB_OUTPUT" --expect-tag "$GITHUB_REF_NAME"

      - name: Test release scripts
        run: |
          pnpm release:test
          node --test scripts/release-update.test.mjs

      - name: Type check
        run: pnpm typecheck

      - name: Type check tests
        run: pnpm typecheck:test

      - name: Run frontend tests
        run: pnpm test

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

      - name: Validate existing tag and release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if ! tag_line="$(git ls-remote --refs origin "refs/tags/$TAG")"; then
            echo "Unable to query remote tag $TAG; refusing to release without a definitive result." >&2
            exit 1
          fi
          tag_sha="$(printf '%s\n' "$tag_line" | awk 'NF {print $1; exit}')"
          if [ -z "$tag_sha" ]; then
            echo "Release tag $TAG is missing on origin; CI does not create tags." >&2
            exit 1
          fi
          if [ -n "$tag_sha" ]; then
            if ! peeled_line="$(git ls-remote origin "refs/tags/$TAG^{}")"; then
              echo "Unable to resolve annotated tag $TAG; refusing to release without a definitive result." >&2
              exit 1
            fi
            peeled_sha="$(printf '%s\n' "$peeled_line" | awk 'NF {print $1; exit}')"
            if [ -n "$peeled_sha" ]; then
              tag_sha="$peeled_sha"
            fi
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG points to $tag_sha, expected $GITHUB_SHA; refusing to release." >&2
              exit 1
            fi
          fi
          if ! release_record="$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { id isDraft isPrerelease publishedAt } } }' \
            -F owner="$GITHUB_REPOSITORY_OWNER" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F tag="$TAG" \
            --jq '.data.repository.release | if . == null then "" else "\(.id)\t\(.isDraft)\t\(.isPrerelease)\t\(.publishedAt // "")" end')"; then
            echo "Unable to query GitHub Release $TAG; refusing to release without a definitive result." >&2
            exit 1
          fi
          if [ -n "$release_record" ]; then
            IFS=$'\t' read -r release_id release_draft release_prerelease release_published_at <<< "$release_record"
            if [ -z "$tag_sha" ]; then
              echo "GitHub Release $TAG exists but its tag is missing; refusing to guess the release commit." >&2
              exit 1
            fi
            if [ "$release_draft" = "true" ] && [ "$release_prerelease" != "$PRERELEASE" ]; then
              echo "GitHub Release $TAG draft prerelease state is $release_prerelease, expected $PRERELEASE; refusing to resume it." >&2
              exit 1
            fi
            if [ "$release_draft" != "true" ] || [ -n "$release_published_at" ]; then
              echo "GitHub Release $TAG is already published; its tag and final asset set will be verified after the build."
            else
              echo "Resuming existing draft GitHub Release $TAG at $GITHUB_SHA."
            fi
          elif [ -n "$tag_sha" ]; then
            echo "Resuming existing tag $TAG at $GITHUB_SHA; a draft release will be created after builds."
          fi

  build-windows:
    name: Build Windows (x64)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required to produce signed updater artifacts."
          }

      - name: Build signed Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build -- --locked

      - name: Collect signed Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'target\release\bundle'
          $out = 'release-assets\windows'
          $groups = @(
            @{ Name = 'nsis'; Pattern = '*.exe' },
            @{ Name = 'msi'; Pattern = '*.msi' }
          )

          foreach ($group in $groups) {
            $source = Join-Path $bundle $group.Name
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Missing bundle directory: $source"
            }
            $files = @(Get-ChildItem -LiteralPath $source -File -Filter $group.Pattern)
            if ($files.Count -eq 0) {
              throw "No $($group.Pattern) artifact found in $source"
            }
            $destinationDirectory = Join-Path $out $group.Name
            New-Item -ItemType Directory -Force -Path $destinationDirectory | Out-Null
            foreach ($file in $files) {
              $signature = "$($file.FullName).sig"
              if (-not (Test-Path -LiteralPath $signature)) {
                throw "Missing updater signature for $($file.FullName)"
              }
              $signatureContent = (Get-Content -LiteralPath $signature -Raw).Trim()
              if ([string]::IsNullOrWhiteSpace($signatureContent)) {
                throw "Empty updater signature for $($file.FullName)"
              }
              $destination = Join-Path $destinationDirectory $file.Name
              if (Test-Path -LiteralPath $destination) {
                throw "Duplicate staged asset name: $($file.Name)"
              }
              Copy-Item -LiteralPath $file.FullName -Destination $destination
              Copy-Item -LiteralPath $signature -Destination "$destination.sig"
            }
          }
          Get-ChildItem -Recurse -File $out | Select-Object FullName, Length

      - name: Upload Windows release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-windows
          path: release-assets/windows
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS (aarch64)
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required to produce signed updater artifacts." >&2
            exit 1
          fi

      - name: Build signed Tauri bundles
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build -- --locked

      - name: Collect signed macOS artifacts
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="target/release/bundle"
          OUT="release-assets/macos/macos"
          mkdir -p "$OUT"

          case "$(uname -m)" in
            arm64|aarch64) ;;
            *) echo "macos-15 release builds must run on ARM64; found $(uname -m)" >&2; exit 1 ;;
          esac

          # macOS ships Bash 3.2: use quoted glob loops, not mapfile/Bash 4.
          TAR_COUNT=0
          TAR_SOURCE=""
          for source in "$BUNDLE"/macos/*.app.tar.gz; do
            [ -f "$source" ] || continue
            TAR_COUNT=$((TAR_COUNT + 1))
            TAR_SOURCE="$source"
          done
          if [ "$TAR_COUNT" -eq 0 ]; then
            echo "No .app.tar.gz updater artifact under $BUNDLE/macos" >&2
            exit 1
          fi
          if [ "$TAR_COUNT" -ne 1 ]; then
            echo "Expected exactly one macOS updater tarball, found $TAR_COUNT" >&2
            exit 1
          fi

          DMG_COUNT=0
          for source in "$BUNDLE"/dmg/*.dmg; do
            [ -f "$source" ] || continue
            DMG_COUNT=$((DMG_COUNT + 1))
            destination="$OUT/$(basename "$source")"
            if [ -e "$destination" ]; then
              echo "Duplicate staged asset name: $(basename "$source")" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "No DMG artifact under $BUNDLE/dmg" >&2
            exit 1
          fi

          # The tar may be generic; normalize it to the ARM updater platform.
          base="$(basename "$TAR_SOURCE")"
          case "$base" in
            *aarch64*) destination="$OUT/$base" ;;
            *) destination="$OUT/AgentHub_${VERSION}_aarch64.app.tar.gz" ;;
          esac
          if [ -e "$destination" ]; then
            echo "Duplicate staged asset name: $(basename "$destination")" >&2
            exit 1
          fi
          if [ ! -f "${TAR_SOURCE}.sig" ]; then
            echo "Missing updater signature for $TAR_SOURCE" >&2
            exit 1
          fi
          if [ -z "$(LC_ALL=C tr -d '[:space:]' < "${TAR_SOURCE}.sig")" ]; then
            echo "Empty updater signature for $TAR_SOURCE" >&2
            exit 1
          fi
          cp "$TAR_SOURCE" "$destination"
          cp "${TAR_SOURCE}.sig" "${destination}.sig"
          find "release-assets/macos" -type f -print | LC_ALL=C sort

      - name: Upload macOS release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-macos
          path: release-assets/macos
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux (x64)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux desktop bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not require the updater key: unsigned .deb + AppImage must still ship.
          # When the key is present (same secret as Windows/macOS), also emit .sig.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is set; building signed Linux updater artifacts."
            pnpm tauri build --bundles deb,appimage -- --locked
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is unset; building unsigned Linux installers."
            pnpm tauri:build:linux -- --locked
          fi

      - name: Collect Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="target/release/bundle"
          OUT="release-assets/linux"
          mkdir -p "$OUT/deb" "$OUT/appimage"

          DEB_COUNT=0
          for source in "$BUNDLE"/deb/*.deb; do
            [ -f "$source" ] || continue
            DEB_COUNT=$((DEB_COUNT + 1))
            destination="$OUT/deb/$(basename "$source")"
            if [ -e "$destination" ]; then
              echo "Duplicate staged asset name: $(basename "$source")" >&2
              exit 1
            fi
            cp "$source" "$destination"
            if [ -f "${source}.sig" ]; then
              cp "${source}.sig" "${destination}.sig"
            fi
          done
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "No .deb artifact under $BUNDLE/deb" >&2
            exit 1
          fi

          APPIMAGE_COUNT=0
          APPIMAGE_SIG_COUNT=0
          for source in "$BUNDLE"/appimage/*.AppImage; do
            [ -f "$source" ] || continue
            APPIMAGE_COUNT=$((APPIMAGE_COUNT + 1))
            destination="$OUT/appimage/$(basename "$source")"
            if [ -e "$destination" ]; then
              echo "Duplicate staged asset name: $(basename "$source")" >&2
              exit 1
            fi
            cp "$source" "$destination"
            if [ -f "${source}.sig" ]; then
              if [ -z "$(LC_ALL=C tr -d '[:space:]' < "${source}.sig")" ]; then
                echo "Empty updater signature for $source; publishing the installer without it." >&2
              else
                cp "${source}.sig" "${destination}.sig"
                APPIMAGE_SIG_COUNT=$((APPIMAGE_SIG_COUNT + 1))
              fi
            fi
          done
          if [ "$APPIMAGE_COUNT" -eq 0 ]; then
            echo "No AppImage artifact under $BUNDLE/appimage" >&2
            exit 1
          fi
          if [ "$APPIMAGE_SIG_COUNT" -eq 0 ]; then
            echo "Linux AppImage updater signatures were not produced; installers will still be published."
          fi
          find "release-assets/linux" -type f -print | LC_ALL=C sort

      - name: Upload Linux release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-linux
          path: release-assets/linux
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Download Windows release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-windows
          path: build-tree/target/release/bundle

      - name: Download macOS release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-macos
          path: build-tree/target/release/bundle

      - name: Download Linux release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-linux
          path: build-tree/target/release/bundle

      - name: Validate publish target and prepare assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "Releases may only publish from refs/tags/$TAG; received $GITHUB_REF" >&2
            exit 1
          fi
          case "$PRERELEASE" in
            true|false) ;;
            *) echo "Invalid prerelease value '$PRERELEASE'" >&2; exit 1 ;;
          esac
          if ! tag_line="$(git ls-remote --refs origin "refs/tags/$TAG")"; then
            echo "Unable to query remote tag $TAG; refusing to release without a definitive result." >&2
            exit 1
          fi
          tag_sha="$(printf '%s\n' "$tag_line" | awk 'NF {print $1; exit}')"
          if [ -z "$tag_sha" ]; then
            echo "Release tag $TAG is missing on origin; CI does not create tags." >&2
            exit 1
          fi
          if [ -n "$tag_sha" ]; then
            if ! peeled_line="$(git ls-remote origin "refs/tags/$TAG^{}")"; then
              echo "Unable to resolve annotated tag $TAG; refusing to release without a definitive result." >&2
              exit 1
            fi
            peeled_sha="$(printf '%s\n' "$peeled_line" | awk 'NF {print $1; exit}')"
            if [ -n "$peeled_sha" ]; then
              tag_sha="$peeled_sha"
            fi
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG points to $tag_sha, expected $GITHUB_SHA; refusing to release." >&2
              exit 1
            fi
          fi
          RELEASE_STATE=none
          if ! release_record="$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { id isDraft isPrerelease publishedAt } } }' \
            -F owner="$GITHUB_REPOSITORY_OWNER" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F tag="$TAG" \
            --jq '.data.repository.release | if . == null then "" else "\(.id)\t\(.isDraft)\t\(.isPrerelease)\t\(.publishedAt // "")" end')"; then
            echo "Unable to query GitHub Release $TAG; refusing to release without a definitive result." >&2
            exit 1
          fi
          if [ -n "$release_record" ]; then
            IFS=$'\t' read -r release_id release_draft release_prerelease release_published_at <<< "$release_record"
            if [ -z "$tag_sha" ]; then
              echo "GitHub Release $TAG exists but its tag is missing; refusing to guess the release commit." >&2
              exit 1
            fi
            if [ "$release_draft" = "true" ] && [ "$release_prerelease" != "$PRERELEASE" ]; then
              echo "GitHub Release $TAG draft prerelease state is $release_prerelease, expected $PRERELEASE; refusing to resume it." >&2
              exit 1
            fi
            if [ "$release_draft" != "true" ] || [ -n "$release_published_at" ]; then
              RELEASE_STATE=published
              echo "GitHub Release $TAG is already published; its final asset set will be verified before the retry completes."
            else
              RELEASE_STATE=draft
              echo "Resuming existing draft GitHub Release $TAG at $GITHUB_SHA."
            fi
          elif [ -n "$tag_sha" ]; then
            echo "Resuming existing tag $TAG at $GITHUB_SHA; a draft release will be created."
          fi
          echo "RELEASE_STATE=$RELEASE_STATE" >> "$GITHUB_ENV"

          BUNDLE="build-tree/target/release/bundle"
          ASSETS="release-assets"
          mkdir -p "$ASSETS"
          while IFS= read -r -d '' source; do
            name="$(basename "$source")"
            destination="$ASSETS/$name"
            if [ -e "$destination" ]; then
              echo "Release asset filename collision: $name" >&2
              exit 1
            fi
            cp "$source" "$destination"
          done < <(find "$BUNDLE" -type f -print0)

          DEB_COUNT=0
          APPIMAGE_COUNT=0
          while IFS= read -r -d '' source; do
            case "$source" in
              *.deb) DEB_COUNT=$((DEB_COUNT + 1)) ;;
              *.AppImage) APPIMAGE_COUNT=$((APPIMAGE_COUNT + 1)) ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          if [ "$DEB_COUNT" -eq 0 ] || [ "$APPIMAGE_COUNT" -eq 0 ]; then
            echo "Linux release assets are required (.deb and AppImage); found deb=$DEB_COUNT appimage=$APPIMAGE_COUNT" >&2
            exit 1
          fi

          REQUIRED_PLATFORMS="windows-x86_64,darwin-aarch64"
          LINUX_SIGS="$(find "$BUNDLE" -type f -name '*.AppImage.sig' -print 2>/dev/null || true)"
          if [ -n "$LINUX_SIGS" ]; then
            REQUIRED_PLATFORMS="$REQUIRED_PLATFORMS,linux-x86_64"
          else
            echo "Linux updater signatures are absent; publishing installers without a signed linux-x86_64 feed entry."
          fi

          node scripts/build-latest-json.mjs \
            --version "$VERSION" \
            --notes "AgentHub $TAG" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --target-dir "$BUNDLE" \
            --mac-arch aarch64 \
            --required-platforms "$REQUIRED_PLATFORMS" \
            --out "$ASSETS/latest.json"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const feed = JSON.parse(fs.readFileSync('release-assets/latest.json', 'utf8'));
          for (const platform of ['windows-x86_64', 'darwin-aarch64']) {
            if (!feed.platforms?.[platform]?.url || !feed.platforms?.[platform]?.signature) {
              throw new Error(`latest.json is missing a signed ${platform} updater artifact`);
            }
          }
          const linux = feed.platforms?.['linux-x86_64'];
          if (linux && (!linux.url || !linux.signature)) {
            throw new Error('latest.json linux-x86_64 is present but not a signed updater artifact');
          }
          if (!linux) {
            console.warn('latest.json has no linux-x86_64 entry; Linux auto-update is not signed yet. .deb and AppImage are still published.');
          }
          NODE

          if [ "$RELEASE_STATE" = published ]; then
            # A previous publish request may have succeeded while its client
            # lost the response. Treat that state as idempotently complete
            # only when the remote release still points at this exact commit
            # and contains exactly the asset set prepared by this run.
            if ! published_release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"; then
              echo "Unable to read the already-published GitHub Release $TAG; refusing to guess its state." >&2
              exit 1
            fi
            published_tag="$(printf '%s' "$published_release_json" | jq -r '.tag_name // empty')"
            published_draft="$(printf '%s' "$published_release_json" | jq -r '.draft // empty')"
            published_prerelease="$(printf '%s' "$published_release_json" | jq -r '.prerelease // empty')"
            if [ "$published_tag" != "$TAG" ] || [ "$published_draft" != "false" ] || [ "$published_prerelease" != "$PRERELEASE" ]; then
              echo "GitHub Release $TAG changed state while assets were prepared; refusing to overwrite it." >&2
              exit 1
            fi
            expected_assets="$(find "$ASSETS" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
            remote_assets="$(printf '%s' "$published_release_json" | jq -r '.assets[]?.name' | LC_ALL=C sort)"
            if ! diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$remote_assets"); then
              echo "Published GitHub Release $TAG assets do not match this run's expected asset set; refusing to overwrite it." >&2
              exit 1
            fi
            echo "Verified published GitHub Release $TAG at $GITHUB_SHA with the expected asset set; retry is idempotently complete."
          fi

          if [ "$RELEASE_STATE" = draft ]; then
            # A draft retry may have a partial asset upload from an earlier
            # request. Allow missing expected assets so the upload can repair
            # it, but reject every remote asset outside this run's allowlist.
            if ! draft_release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"; then
              echo "Unable to read the existing draft GitHub Release $TAG; refusing to resume it." >&2
              exit 1
            fi
            draft_tag="$(printf '%s' "$draft_release_json" | jq -r '.tag_name // empty')"
            draft_state="$(printf '%s' "$draft_release_json" | jq -r '.draft // empty')"
            draft_prerelease="$(printf '%s' "$draft_release_json" | jq -r '.prerelease // empty')"
            if [ "$draft_tag" != "$TAG" ] || [ "$draft_state" != "true" ] || [ "$draft_prerelease" != "$PRERELEASE" ]; then
              echo "Existing draft GitHub Release $TAG does not match this tag or prerelease state; refusing to resume it." >&2
              exit 1
            fi
            expected_assets="$(find "$ASSETS" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
            remote_assets="$(printf '%s' "$draft_release_json" | jq -r '.assets[]?.name' | LC_ALL=C sort)"
            unexpected_assets="$(comm -23 <(printf '%s\n' "$remote_assets") <(printf '%s\n' "$expected_assets"))"
            if [ -n "$unexpected_assets" ]; then
              echo "Existing draft GitHub Release $TAG contains unexpected assets; refusing to delete or overwrite them:" >&2
              printf '%s\n' "$unexpected_assets" >&2
              exit 1
            fi
          fi

          find "$ASSETS" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort

          # The triggering v* tag is the release identity. CI never creates
          # or moves tags; a missing tag is a hard failure, not a claim.
          if [ -z "$tag_sha" ]; then
            echo "Release tag $TAG is missing on origin; CI does not create tags." >&2
            exit 1
          fi
          if ! tag_line="$(git ls-remote --refs origin "refs/tags/$TAG")"; then
            echo "Unable to confirm remote tag $TAG before creating the release." >&2
            exit 1
          fi
          remote_tag_sha="$(printf '%s\n' "$tag_line" | awk 'NF {print $1; exit}')"
          if ! peeled_line="$(git ls-remote origin "refs/tags/$TAG^{}")"; then
            echo "Unable to resolve remote tag $TAG before creating the release." >&2
            exit 1
          fi
          peeled_sha="$(printf '%s\n' "$peeled_line" | awk 'NF {print $1; exit}')"
          if [ -n "$peeled_sha" ]; then
            remote_tag_sha="$peeled_sha"
          fi
          if [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "Remote tag $TAG points to $remote_tag_sha, expected $GITHUB_SHA; refusing to publish." >&2
            exit 1
          fi

      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_STATE" = published ]; then
            echo "GitHub Release $TAG is already published with the expected assets; skipping release creation."
          elif [ "$RELEASE_STATE" = draft ]; then
            gh release upload "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHub $TAG" \
              --notes "AgentHub $TAG"
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHub $TAG" \
              --notes "AgentHub $TAG" \
              --draft \
              --prerelease \
              --verify-tag
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentHub $TAG" \
              --notes "AgentHub $TAG" \
              --draft \
              --verify-tag
          fi

      - name: Verify release assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_STATE" = published ]; then
            echo "Published release $TAG was already verified; skipping draft asset verification."
            exit 0
          fi
          if ! release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"; then
            echo "Unable to read GitHub Release $TAG after uploading assets; refusing to publish." >&2
            exit 1
          fi
          release_tag="$(printf '%s' "$release_json" | jq -r '.tag_name // empty')"
          release_draft="$(printf '%s' "$release_json" | jq -r '.draft // empty')"
          release_prerelease="$(printf '%s' "$release_json" | jq -r '.prerelease // empty')"
          if [ "$release_tag" != "$TAG" ] || [ "$release_draft" != "true" ] || [ "$release_prerelease" != "$PRERELEASE" ]; then
            echo "GitHub Release $TAG is not the expected draft/prerelease after asset upload; refusing to publish." >&2
            exit 1
          fi
          expected_assets="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          remote_assets="$(printf '%s' "$release_json" | jq -r '.assets[]?.name' | LC_ALL=C sort)"
          if ! diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$remote_assets"); then
            echo "GitHub Release $TAG assets do not exactly match this run after upload; refusing to publish." >&2
            exit 1
          fi
          echo "Verified GitHub Release $TAG draft metadata and exact asset names before publishing."

      - name: Publish release and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_STATE" = published ]; then
            echo "GitHub Release $TAG is already published with the expected assets; skipping publish mutation."
            exit 0
          fi
          if ! tag_line="$(git ls-remote --refs origin "refs/tags/$TAG")"; then
            echo "Unable to confirm remote tag $TAG before publishing the draft." >&2
            exit 1
          fi
          remote_tag_sha="$(printf '%s\n' "$tag_line" | awk 'NF {print $1; exit}')"
          if ! peeled_line="$(git ls-remote origin "refs/tags/$TAG^{}")"; then
            echo "Unable to resolve remote tag $TAG before publishing the draft." >&2
            exit 1
          fi
          peeled_sha="$(printf '%s\n' "$peeled_line" | awk 'NF {print $1; exit}')"
          if [ -n "$peeled_sha" ]; then
            remote_tag_sha="$peeled_sha"
          fi
          if [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "Remote tag $TAG points to $remote_tag_sha, expected $GITHUB_SHA; refusing to publish." >&2
            exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Write release summary
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          {
            if [ "${RELEASE_STATE:-}" = published ]; then
              echo "### Release already published (idempotent retry)"
            else
              echo "### Release published"
            fi
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Prerelease: \`$PRERELEASE\`"
            echo "- Platforms: Windows (signed), macOS (signed updater; Apple notarization not promised), Linux (.deb + AppImage)"
            echo "- Assets:"
            find release-assets -maxdepth 1 -type f -printf '  - `%f`\n' | LC_ALL=C sort
            echo "- URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            if ! grep -q '"linux-x86_64"' release-assets/latest.json; then
              echo "- Linux auto-update: not signed yet (installers are still published). Remaining secret: \`TAURI_SIGNING_PRIVATE_KEY\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
