[package]
name = "agenthub-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AgentHub Tauri v2 GUI shell (thin layer over agenthub-core)"
default-run = "agenthub-gui"

[lib]
name = "agenthub_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
go-route-bind-probe = []

[[bin]]
name = "agenthub-gui"
path = "src/main.rs"

[[example]]
name = "go_route_bind_e2e_probe"
path = "examples/go_route_bind_e2e_probe.rs"
required-features = ["go-route-bind-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dependencies]
agenthub-core = { workspace = true }
notify = { version = "6", features = ["macos_fsevent"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
libc = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
