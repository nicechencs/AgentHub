name: PR CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check app
        run: pnpm typecheck

      - name: Type check tests
        run: pnpm typecheck:test

      - name: Linux prereq script tests
        run: node --test scripts/check-linux-prereqs.test.mjs

      - name: Frontend tests (mock backend + contracts)
        run: pnpm test

      - name: Core Rust tests (adapter contract + services)
        run: cargo test -p agenthub-core --locked
