[package]
name = "agenthub-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AgentHub business core — shared by GUI and CLI (no Tauri dependency)"

[features]
default = []
go-product-preflight-probe = []
gateway-snapshot-probe = []

[[example]]
name = "go_product_preflight_probe"
path = "examples/go_product_preflight_probe.rs"
required-features = ["go-product-preflight-probe"]

[[example]]
name = "gateway_snapshot_probe"
path = "examples/gateway_snapshot_probe.rs"
required-features = ["gateway-snapshot-probe"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = "0.0.12"
thiserror = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
rusqlite = { workspace = true }
which = { workspace = true }
semver = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
toml_edit = "0.25.13"
sha2 = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
ureq = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
trash = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tower = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }

[target.'cfg(windows)'.dependencies]
socket2 = "0.5"

[dev-dependencies]
tempfile = { workspace = true }
